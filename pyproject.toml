[tool.poetry]
name = "racepace-web"
version = "0.1.0"
description = "F1 lap time visualization and race pace analysis"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<4.0"

# Web Framework
fastapi = "^0.115.12"
uvicorn = "^0.34.3"
gunicorn = "^22.0.0"

# Database
sqlalchemy = "^2.0.41"
sqlmodel = "^0.0.37"
psycopg2-binary = "^2.9.10"

# Environment & Validation
python-dotenv = "^1.1.0"
pydantic = "^2.12"

# Data
fastf1 = "*"
icalendar = "^6.3.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SLF",   # flake8-self
    "TCH",   # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PLC",   # pylint convention
    "PLE",   # pylint errors
    "PLW",   # pylint warnings
    "PERF",  # perflint
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "ISC001",  # conflicts with ruff formatter
    "RET504",  # unnecessary assignment before return
    "UP007",   # use X | Y for union types (already used, but can conflict with older Pydantic)
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
